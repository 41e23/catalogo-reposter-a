{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alacena & Molde, catálogo de materiales e insumos para repostería.">
  <title>{% block title %}Alacena & Molde{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'inicio:inicio' %}"><span class="brand-mark">A<span>&</span>M</span><span class="brand-copy">Alacena <i>&</i> Molde<small>insumos para crear</small></span></a>
    <nav class="main-nav" aria-label="Navegación principal"><a href="{% url 'inicio:inicio' %}#catalogo">Catálogo</a><a href="{% url 'inicio:inicio' %}#proveedores">Proveedores</a><a href="{% url 'inicio:nosotros' %}">Nosotros</a></nav>
    <a class="selection-button" href="{% url 'inicio:inicio' %}#catalogo">Ver catálogo <span>↘</span></a>
  </header>
  {% block content %}{% endblock %}
  <footer><span>© 2026 Alacena & Molde</span><span>Un catálogo para manos inquietas.</span></footer>
</body>
</html>
