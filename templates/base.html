<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Dulce Repostería{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #fff8f3;
            color: #4a2c2a;
        }
        header {
            background-color: #d97a8c;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        header h1 {
            color: #fff;
            margin: 0;
            font-size: 1.4rem;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #8a6a63;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>🧁 Dulce Repostería</h1>
        <nav>
            <ul>
                <li><a href="{% url 'inicio:inicio' %}">Inicio</a></li>
                <li><a href="{% url 'inicio:nosotros' %}">Nosotros</a></li>
                <li><a href="{% url 'materiales:lista' %}">Materiales</a></li>
                <li><a href="{% url 'proveedores:lista' %}">Proveedores</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>
        <p>Proyecto académico — Programación Backend | INACAP</p>
    </footer>
</body>
</html>
